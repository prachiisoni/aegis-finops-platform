apiVersion: v1
kind: Namespace
metadata:
  name: aegis-finops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-finops-gateway
  namespace: aegis-finops
  labels:
    app: aegis-finops-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aegis-finops-gateway
  template:
    metadata:
      labels:
        app: aegis-finops-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: finops-gateway
          image: aegisfinops/finops-gateway-service:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: AEGIS_CLICKHOUSE_URL
              value: "http://aegis-clickhouse.aegis-finops.svc.cluster.local:8123/"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-finops-gateway-svc
  namespace: aegis-finops
spec:
  type: ClusterIP
  selector:
    app: aegis-finops-gateway
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegis-finops-gateway-hpa
  namespace: aegis-finops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegis-finops-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70