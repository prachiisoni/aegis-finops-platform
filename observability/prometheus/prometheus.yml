global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'aegis-finops-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['finops-gateway:8080']
        labels:
          application: 'aegis-finops-gateway'
          environment: 'production'